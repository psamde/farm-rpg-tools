name: Check site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Test planner and browser logic
        run: |
          python -m unittest test_planner test_secondary test_external test_passive test_primary_cache
          node test_route.cjs
          node test_save.cjs
          node test_suggestions.cjs
      - name: Build static site
        run: python build_static.py
      - name: Check leftover allocation in WebAssembly
        run: node test_bottle_wasm.cjs
